name: Build Image DB

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install opencv-python-headless httpx numpy

      - name: Build
        run: python build_image_db.py

      - name: Check changes
        id: changes
        run: |
          if [ -f no_changes ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate tag
        id: tag
        if: steps.changes.outputs.changed == 'true'
        run: |
          DATE=$(date +'%Y.%m.%d')

          LIST=$(gh release list --limit 100 | awk '{print $1}' | grep "^$DATE" || true)

          if [ -z "$LIST" ]; then
            IDX=0
          else
            IDX=$(echo "$LIST" | sed "s/^$DATE\.//" | sort -n | tail -n1)
            IDX=$((IDX+1))
          fi

          TAG="${DATE}.${IDX}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        if: steps.changes.outputs.changed == 'true'
        run: |
          TAG=${{ steps.tag.outputs.tag }}

          gh release create "$TAG" \
            image_index.db \
            --title "$TAG" \
            --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}